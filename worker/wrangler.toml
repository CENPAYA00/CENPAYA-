name = "cenpaya-supabase"
main = "src/index.ts"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://vtfwglrjjznxxujrlcnb.supabase.co"
# Set CENPAYA_ORIGINS to exact deployed frontend origins.
# Set SUPABASE_JWT_ALGORITHM to the active Supabase signing algorithm.
# Set PAYMENT_ENVIRONMENT to sandbox or production.

[[services]]
binding = "D1_IDENTITY"
service = "cenpaya-d1-worker"

# Configure as Cloudflare Worker secrets, never commit values:
# SUPABASE_ANON_KEY
# D1_INTERNAL_CALL_SECRET
# D1_TO_SUPABASE_HMAC_SECRET
# HS256: SUPABASE_JWT_SECRET
# RS256/ES256: SUPABASE_JWT_PRIVATE_JWK
# Optional: SUPABASE_JWT_KID
