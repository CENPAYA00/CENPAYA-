name = "cenpaya-d1-worker"
main = "src/index.ts"
migrations_dir = "../database/d1/migrations"
compatibility_date = "2026-11-20"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "cenpaya-db"
database_id = "68b307af-935e-45ca-933f-2e4cf6db8ee2"

# Configure the following bindings in the D1 Worker's Cloudflare environment.
# AI: existing Workers AI / AI Search binding used with AI_SEARCH_NAME.
# CACHE: existing KV namespace; optional and only for rebuildable public cache.
# OTP_DELIVERY: service binding to the Cenpaya API email-delivery Worker.
#
# Configure these Worker variables:
# ALLOWED_ORIGINS = exact comma-separated frontend origins
# FRONTEND_URL = canonical frontend origin
# GOOGLE_REDIRECT_URI = https://<this-worker-host>/api/auth/google/callback
# AI_SEARCH_NAME = exact existing Cenpaya AI Search index/project name
# SESSION_TTL_SECONDS = optional
#
# Configure these Worker secrets:
# OTP_PEPPER
# D1_INTERNAL_CALL_SECRET (must match the Supabase Worker's D1_INTERNAL_CALL_SECRET)
# D1_TO_SUPABASE_HMAC_SECRET (must match the Supabase Worker's D1_TO_SUPABASE_HMAC_SECRET)
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# UPSTASH_REDIS_REST_TOKEN (optional)
# MEDIA_URL_SIGNING_SECRET
# UPSTASH_REDIS_REST_URL may be a variable; Redis is optional.
# MEDIA_BUCKET: bind the verified existing private R2 bucket before enabling uploads.
# MEDIA_URL_SIGNING_SECRET: 32+ random bytes, stored as a Worker secret.
#
# Never place provider credentials or secret values in this file.

# FFmpeg processor integration:
# Option A: bind VIDEO_PROCESSOR to an existing HTTPS-capable Worker gateway.
# Option B: set VIDEO_PROCESSOR_URL to the public HTTPS base URL of the Docker processor.
# Set VIDEO_PROCESSOR_TOKEN as a secret on THIS D1 Worker and on the processor host.
# B2/Tigris credentials remain on the processor host; never put them in this file.

[triggers]
crons = ["* * * * *"]
