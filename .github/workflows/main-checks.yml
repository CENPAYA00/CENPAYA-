name: Main branch checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        id: build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          cat build.log >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-build-diagnostics
          path: build.log
          if-no-files-found: ignore
      - name: Upload production build for verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: main-production-build
          path: dist/
          if-no-files-found: error
